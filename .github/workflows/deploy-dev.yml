name: Deploy to GCP Dev

on:
  push:
    branches:
      - dev

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  IMAGE_NAME: tikninja-app-dev
  REGION: ${{ secrets.GCP_LOCATION }}
  REGISTRY_NAME: ${{ secrets.GCP_LOCATION }}-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ env.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker ${{ env.REGISTRY_NAME }}

      - name: Build and Push Docker image
        run: |
          IMAGE_URI=$REGISTRY_NAME/$PROJECT_ID/$IMAGE_NAME:$GITHUB_SHA
          docker build -t $IMAGE_URI .
          docker tag $IMAGE_URI $REGISTRY_NAME/$PROJECT_ID/$IMAGE_NAME:latest
          docker push $IMAGE_URI

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI=$REGISTRY_NAME/$PROJECT_ID/$IMAGE_NAME:latest
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated 
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 1 \
            --service-account ${{ secrets.GCP_PROJECT_SA_NAME }} \